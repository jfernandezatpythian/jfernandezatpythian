# flyway.conf
# Fails the migration if any scripts have invalid names. Recommended!
flyway.validateMigrationNaming=true
# JDBC URL for your on-premise Oracle database
# Example: jdbc:oracle:thin:@your_db_host:1521:YOUR_SID
flyway.url=${ORACLE_URL}

# Database user
flyway.user=${ORACLE_USER}

# Database password (injected from GitHub Secrets)
flyway.password=${ORACLE_PASSWORD}

# Location of your SQL migration scripts
flyway.locations=filesystem:sql

# The schemas to manage. For Oracle, this is usually the same as the user
flyway.schemas=${ORACLE_USER}
