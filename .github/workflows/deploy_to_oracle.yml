name: Deploy Oracle Database Changes (Native SQL)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-sql:
    name: Deploy to Oracle DB
    runs-on: self-hosted

    steps:
      - name: 1. Check out repository code
        uses: actions/checkout@v4

      - name: 2. Make deployment script executable
        run: chmod +x scripts/deploy.sh

      - name: 3. Run SQL Deployment Script
        env:
          # Inject secrets into the environment for the script to use
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
          ORACLE_PASSWORD: ${{ secrets.ORACLE_PASSWORD }}
          ORACLE_CONN_STRING: ${{ secrets.ORACLE_CONN_STRING }} # e.g., yourhost:1521/ORCL
        run: ./scripts/deploy.sh
