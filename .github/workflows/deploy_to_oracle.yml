name: Deploy Oracle Changes with Python

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-to-oracle:
    name: Deploy to Oracle DB
    runs-on: self-hosted

    steps:
      - name: 1. Check out repository code
        uses: actions/checkout@v4

      - name: 2. Run Python Deployment Script
        env:
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
          ORACLE_PASSWORD: ${{ secrets.ORACLE_PASSWORD }}
          ORACLE_DSN: ${{ secrets.ORACLE_DSN }} # e.g., yourhost:1521/ORCL
        run: /usr/bin/python3.8 scripts/deploy.py
