# liquibase.properties

# Path to your master changelog file
changeLogFile: master.xml

# JDBC URL for your on-premise Oracle database
url: ${ORACLE_CONN_STRING}

# Database user and password (injected from GitHub Secrets)
username: ${ORACLE_USER}
password: ${ORACLE_PASSWORD}

# Specify the Oracle JDBC driver (Liquibase includes it)
driver: oracle.jdbc.OracleDriver
